# Checks only: no secrets, no deploy step. The template alone must pass here: the runner has no real content
# (no ./content folder) and no .private folder, so the build reads the fake examples.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:themes
      - run: npm run build
        env:
          CONTENT_DIR: examples
          CONTENT_PRODUCT: example-seller/example-house
